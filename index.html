
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Tìm kiếm</title>
</head>
<body>
    <h1>Form Tìm kiếm Google</h1>

    <form action="https://www.google.com.vn/search" method="GET">
        <input
            type="text"
            name="q"
            placeholder="Nhập từ khóa cần tìm"
        >

        <input type="submit" value="Tìm kiếm">
    </form>
</body>
</html>
